<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | OrdiRodi</title>
    <meta name="description" content="Sélection de projets web néo-brutalistes par OrdiRodi.">
    <link rel="icon" href="/favicon.ico?v=20260522" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=20260511-portfolio-redesign">
    <style>
      .neo-brutal-card {
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
        border: 3px solid #000000;
      }
      .neo-brutal-card:hover {
        transform: translate(-4px, -4px);
        box-shadow: 12px 12px 0px 0px rgba(0,0,0,1);
      }
      .portfolio-image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        column-gap: 1.25rem;
        row-gap: 2rem;
      }
      .portfolio-image-card {
        display: flex;
        flex-direction: column;
      }
      .portfolio-image-link {
        display: block;
        text-decoration: none;
      }
      .portfolio-image-card img {
        width: 100%;
        aspect-ratio: 600 / 304;
        height: auto;
        object-fit: cover;
        border-bottom: 3px solid #000000;
      }
      .portfolio-image-card-content {
        padding: 1rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }
      .portfolio-image-card h3 {
        font-weight: bold;
        font-size: clamp(1rem, 1.4vw, 1.15rem);
        margin-bottom: 0.25rem;
      }
      .portfolio-image-card .category {
        font-size: 0.875rem;
        color: #4c4546;
        font-weight: 500;
        margin-bottom: 0.75rem;
      }
      .portfolio-image-card p {
        font-size: 0.875rem;
        color: #4c4546;
        margin-bottom: 1rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <nav class="site-nav" aria-label="Navigation principale">
      <div class="nav-branding">
        <a class="brand" href="/">OrdiRodi</a>
        <span class="tagline">On modernise le web, un pixel à la fois.</span>
      </div>
      <div class="nav-links">
        <a class="active" href="/portfolio">Portfolio</a>
        <a href="/contact">Contact</a>
      </div>
    </nav>

    <main class="section">
      <div class="wrap">
        <span class="eyebrow tilt-left">Portfolio</span>
        <h1 class="page-title">Nos récentes<br>créations:</h1>
        <p class="lead"></p>

        <section class="portfolio-image-grid" aria-label="Sites web realises">
          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="https://alexroof.ca" class="portfolio-image-link">
              <img alt="L'humoriste Alex Roof" src="/assets/portfolio/alexroof.ca.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>L'humoriste Alex Roof</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="Plomberie Pro" src="/assets/portfolio/plomberie_pro.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>Plomberie Pro</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="Prestige Immobilier" src="/assets/portfolio/prestige-immobilier2.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>Prestige Immobilier</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="L'Atelier du Bois" src="/assets/portfolio/atelier-du-bois1.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>L'Atelier du Bois</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="Vert Horizon" src="/assets/portfolio/vert-horizon1.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>Vert Horizon</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="Pneu Expert" src="/assets/portfolio/pneu-expert1.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>Pneu Expert</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="Studio Lumina" src="/assets/portfolio/studio.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>Studio Lumina</h3>
            </div>
          </div>

          <div class="neo-brutal-card bg-white portfolio-image-card">
            <a href="#" class="portfolio-image-link">
              <img alt="Pulse Fitness" src="/assets/portfolio/Gym.png">
            </a>
            <div class="portfolio-image-card-content">
              <h3>Pulse Fitness</h3>
            </div>
          </div>
      </div>
    </main>

    <section class="section cta-band">
      <div class="wrap">
        <div class="actions center-actions">
          <a class="button" href="/contact">Contactez-nous pour un estimé</a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <a class="brand" href="/">OrdiRodi</a>
      <div class="copyright">© 2026 OrdiRodi.</div>
    </footer>
  </body>
</html>
